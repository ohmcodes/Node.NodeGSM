<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="NodeGSM">
  <title>NodeGSM</title>
  <!-- Mark only, transparent background: the accent blue works on dark and light. Geometry is mirrored in scripts/build-icons.js -->
  <g fill="#4f8cff">
    <!-- stacked server units: the two stems of the N -->
    <rect x="67"  y="71"  width="30" height="32" rx="9"/>
    <rect x="67"  y="112" width="30" height="32" rx="9"/>
    <rect x="67"  y="153" width="30" height="32" rx="9"/>
    <rect x="159" y="71"  width="30" height="32" rx="9"/>
    <rect x="159" y="112" width="30" height="32" rx="9"/>
    <rect x="159" y="153" width="30" height="32" rx="9"/>
    <!-- network link: the diagonal of the N -->
    <line x1="82" y1="87" x2="174" y2="169" stroke="#4f8cff" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- nodes -->
  <circle cx="82"  cy="87"  r="10" fill="#dbe7ff"/>
  <circle cx="174" cy="169" r="10" fill="#dbe7ff"/>
</svg>
